# Quality gates — not a production deploy. Production is Ubuntu (docs/DEPLOY-UBUNTU.md).
name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --no-package-lock can re-hoist cookie@0.7 over Astro's cookie@2; pin cookie with the install.
      - name: Install Tailwind Linux native binding
        run: npm install --no-save --no-package-lock -w web @tailwindcss/oxide-linux-x64-gnu@4.3.3 cookie@^2.0.1

      - name: Astro check + server/studio typecheck
        run: npm run typecheck

  smoke:
    name: Playwright + Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --no-package-lock can re-hoist cookie@0.7 over Astro's cookie@2; pin cookie with the install.
      - name: Install Tailwind Linux native binding
        run: npm install --no-save --no-package-lock -w web @tailwindcss/oxide-linux-x64-gnu@4.3.3 cookie@^2.0.1

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build web (fallback OK without Sanity secrets)
        run: npm run build:web

      - name: Playwright smoke + a11y
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Lighthouse CI
        run: npm run test:lighthouse

      - name: Upload Lighthouse results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 14
