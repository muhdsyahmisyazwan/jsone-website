# Build Astro (`web/`) and deploy to GitHub Pages.
# Repo Settings → Pages → Source must be "GitHub Actions" (not "Deploy from a branch").
name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm/cli#4828: Windows-generated lockfiles can omit other-platform optional
      # native bindings; force the Linux Tailwind oxide package used by @tailwindcss/vite.
      - name: Install Tailwind Linux native binding
        run: npm install --no-save --no-package-lock -w web @tailwindcss/oxide-linux-x64-gnu@4.3.3

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Astro
        working-directory: web
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          # Astro expects base without a trailing slash; assetUrl() still guards BASE_URL.
          BASE="${PAGES_BASE%/}"
          npx astro build --site "$PAGES_ORIGIN" --base "$BASE"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
