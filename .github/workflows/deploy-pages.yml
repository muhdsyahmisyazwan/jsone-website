# Static preview mirror on GitHub Pages — NOT production.
# Production: Ubuntu + Nginx + Node (docs/DEPLOY-UBUNTU.md, docs/PRODUCT-DECISIONS.md).
# This workflow has no /api/* (contact, preview, webhook will not work).
name: Preview — GitHub Pages (NOT production)

on:
  workflow_dispatch:
    inputs:
      allow_fallback_only:
        description: 'Allow deploy without Sanity secrets (i18n fallback content only)'
        type: boolean
        default: false
  # Automatic push deploys are disabled so Pages is never mistaken for production.
  # Re-enable only for intentional preview mirrors, and keep the Sanity secret gate below.
  # push:
  #   branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm/cli#4828: Windows-generated lockfiles can omit other-platform optional
      # native bindings; force the Linux Tailwind oxide package used by @tailwindcss/vite.
      # --no-package-lock can re-hoist cookie@0.7 over Astro's cookie@2; pin cookie with the install.
      - name: Install Tailwind Linux native binding
        run: npm install --no-save --no-package-lock -w web @tailwindcss/oxide-linux-x64-gnu@4.3.3 cookie@^2.0.1

      - name: Require Sanity project id (or explicit fallback)
        env:
          PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
          ALLOW_FALLBACK: ${{ inputs.allow_fallback_only }}
        run: |
          if [ -n "$PROJECT_ID" ]; then
            echo "Sanity project id present — CMS-backed preview build."
            exit 0
          fi
          if [ "$ALLOW_FALLBACK" = "true" ]; then
            echo "::warning::Deploying fallback-only content (no PUBLIC_SANITY_PROJECT_ID). Not production."
            exit 0
          fi
          echo "::error::GitHub Pages is not production. Set repository secret PUBLIC_SANITY_PROJECT_ID, or re-run with allow_fallback_only=true."
          exit 1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Astro
        working-directory: web
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ secrets.PUBLIC_SANITY_DATASET }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          # Mark preview hosts so ops don't confuse with www.jsone.com.my
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
        run: |
          # Astro expects base without a trailing slash; assetUrl() still guards BASE_URL.
          BASE="${PAGES_BASE%/}"
          export PUBLIC_SANITY_DATASET="${PUBLIC_SANITY_DATASET:-production}"
          npx astro build --site "$PAGES_ORIGIN" --base "$BASE"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # GitHub requires the `github-pages` environment name for this action.
    # This is still NOT the corporate production site (Ubuntu is).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (preview only)
        id: deployment
        uses: actions/deploy-pages@v5
