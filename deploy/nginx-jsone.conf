# /etc/nginx/sites-available/jsone
# Option A (recommended): Nginx serves static files; proxies /api to Node.
# Option B: proxy everything to Node (simpler; Node serves dist + API).

upstream jsone_node {
    server 127.0.0.1:4321;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name jsone.local www.jsone.com.my jsone.com.my;

    # --- Option A: static from disk, API via Node ---
    root /var/www/jsone/web/dist;
    index index.html;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://jsone_node;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    # TLS: after certbot
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/jsone.com.my/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jsone.com.my/privkey.pem;
}
