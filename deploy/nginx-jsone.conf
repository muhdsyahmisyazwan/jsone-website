# /etc/nginx/sites-available/jsone
# Option A (recommended): Nginx serves static files; proxies /api to Node.
# Option B: proxy everything to Node (simpler; Node serves dist + API).

upstream jsone_node {
    server 127.0.0.1:4321;
    keepalive 8;
}

# Shared security headers (Node also sets these on /api and Option B).
# frame-ancestors allows Sanity Presentation; do not add X-Frame-Options DENY.
map $sent_http_content_type $jsone_csp {
    default "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.sanity.io; font-src 'self' data:; connect-src 'self' https://cdn.sanity.io https://*.api.sanity.io https://challenges.cloudflare.com https://plausible.io https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'self' https://www.sanity.io https://*.sanity.studio http://localhost:3333";
}

limit_req_zone $binary_remote_addr zone=jsone_contact:10m rate=1r/s;

# Apex → www (canonical host matches Astro `site` + robots Sitemap URL).
server {
    listen 80;
    listen [::]:80;
    server_name jsone.com.my;
    return 301 https://www.jsone.com.my$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name jsone.local www.jsone.com.my;

    # --- Option A: static from disk, API via Node ---
    root /var/www/jsone/web/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy $jsone_csp always;

    location /api/contact {
        limit_req zone=jsone_contact burst=5 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://jsone_node;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://jsone_node;
    }

    # Hashed Vite/Astro assets - long cache (content-addressed filenames).
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # HTML + other public files - short/no cache so publish+rebuild is visible quickly.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    # TLS: after certbot - also add HSTS on the 443 server block, e.g.:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/jsone.com.my/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jsone.com.my/privkey.pem;
}
